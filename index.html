<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Agenda Libreta</title>
    
    <!-- Configuración PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2e5932">
    <link rel="apple-touch-icon" href="1794070431331.jpg">
    <link rel="icon" href="1794070431331.jpg" type="image/jpeg">

    <!-- Librerías de Diseño y Funcionalidad -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Kalam:wght@300;400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-cream: #fff9e6;
            --accent-green: #2e5932;
        }

        body {
            background-color: #1a2f23; 
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Kalam', cursive;
        }

        #app-container {
            width: 100%;
            height: 100vh;
            max-width: 420px;
            background-color: var(--bg-cream); 
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        @media (min-width: 421px) {
            #app-container {
                height: 850px;
                max-height: 90vh;
                border-radius: 10px;
                border-left: 12px solid var(--accent-green);
                border-top: 2px solid #a3d9a5;
                border-right: 2px solid #a3d9a5;
                border-bottom: 2px solid #a3d9a5;
            }
        }

        .notebook-bg {
            background-image: repeating-linear-gradient(transparent, transparent 31px, #a0aec0 31px, #a0aec0 32px);
            background-attachment: local;
            background-size: 100% 32px;
            line-height: 32px; 
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .calendar-day {
            border-right: 1px solid rgba(160, 174, 192, 0.4);
            border-bottom: 1px solid rgba(160, 174, 192, 0.4);
        }
        
        .calendar-event {
            font-size: 9px;
            line-height: 1.1;
            background-color: rgba(163, 217, 165, 0.5);
            border-radius: 3px;
            padding: 1px 3px;
            margin-bottom: 1px;
            letter-spacing: -0.1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-family: sans-serif;
            color: var(--accent-green);
        }

        textarea.diary-input {
            background: transparent;
            border: none;
            resize: none;
            line-height: 32px;
            padding-top: 24px;
            font-family: inherit;
        }
        textarea.diary-input:focus, input:focus, select:focus { outline: none; }

        .sketch-checkbox {
            appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid #4a5568;
            border-radius: 4px;
            background-color: transparent;
            cursor: pointer;
            position: relative;
            display: inline-block;
            vertical-align: middle;
            transition: all 0.2s;
        }
        .sketch-checkbox:checked {
            background-color: transparent;
        }
        .sketch-checkbox:checked::after {
            content: '✔';
            position: absolute;
            top: -6px;
            left: 1px;
            font-size: 18px;
            color: var(--accent-green);
            font-family: sans-serif;
        }

        /* Markdown Styles */
        .markdown-content p, .markdown-content ul, .markdown-content ol, .markdown-content li {
            line-height: 32px;
            margin-bottom: 0;
            position: relative;
            top: -6px;
        }
        .markdown-content ul { list-style-type: disc; padding-left: 1.5em; }
        .markdown-content ol { list-style-type: decimal; padding-left: 1.5em; }
        .markdown-content strong { font-weight: bold; color: var(--accent-green); }
        .markdown-content em { font-style: italic; }
        .markdown-content a { color: #15803d; text-decoration: underline; text-decoration-style: dashed; }
        .markdown-content h1, .markdown-content h2, .markdown-content h3 { font-weight: bold; color: var(--accent-green); line-height: 32px; }
        .markdown-content blockquote { border-left: 3px solid var(--accent-green); padding-left: 10px; color: #4a5568; font-style: italic; }
    </style>
</head>
<body>

    <div id="app-container" class="flex flex-col relative notebook-bg">
        <div class="absolute top-0 right-4 bg-[#2e5932] text-[#fff9e6] px-3 py-1 rounded-b-lg font-bold text-sm shadow-md z-20">
            Mi Diario
        </div>

        <!-- VISTA 1: LISTA (MES) -->
        <div id="view-list" class="flex-1 flex flex-col h-full w-full absolute inset-0 transition-opacity duration-300">
            <header class="pt-10 pb-4 px-4 flex justify-between items-center z-10 sticky top-0 bg-transparent border-b-2 border-dashed border-[#2e5932]">
                <button onclick="changeMonth(-1)" class="w-8 h-8 flex items-center justify-center text-[#333] border-2 border-[#333] rounded bg-transparent"><i class="fas fa-chevron-left"></i></button>
                <h1 id="list-month-title" class="text-2xl font-bold text-[#2e5932] capitalize tracking-wide"></h1>
                <button onclick="changeMonth(1)" class="w-8 h-8 flex items-center justify-center text-[#333] border-2 border-[#333] rounded bg-transparent"><i class="fas fa-chevron-right"></i></button>
            </header>
            <main id="list-container" class="flex-1 overflow-y-auto no-scrollbar p-4 pb-24 space-y-4"></main>
        </div>

        <!-- VISTA 1.5: SEMANA -->
        <div id="view-week" class="hidden flex-1 flex flex-col h-full w-full absolute inset-0 transition-opacity duration-300">
            <header class="pt-10 pb-4 px-4 flex justify-between items-center z-10 sticky top-0 bg-transparent border-b-2 border-dashed border-[#2e5932]">
                <h1 class="text-xl font-bold text-[#2e5932] relative w-full text-center cursor-pointer group">
                    <input type="date" id="week-date-picker" onchange="onWeekDateSelected(event)" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full z-10" />
                    Semana: <span id="week-central-date-display" class="underline decoration-dashed decoration-[#2e5932] group-hover:text-[#1a3820] transition-colors">...</span> <i class="fas fa-caret-down text-sm"></i>
                </h1>
            </header>
            <button onclick="changeWeekDay(-1)" class="w-full text-center py-2 bg-transparent text-[#2e5932] font-bold border-b-2 border-dashed border-[#a0aec0] z-10 hover:bg-black/5 transition-colors">
                <i class="fas fa-chevron-up mr-2"></i> Día Anterior
            </button>
            <main id="week-container" class="flex-1 overflow-y-auto no-scrollbar p-3 space-y-4 pb-4"></main>
            <button onclick="changeWeekDay(1)" class="w-full text-center py-2 bg-transparent text-[#2e5932] font-bold border-t-2 border-dashed border-[#a0aec0] z-10 hover:bg-black/5 transition-colors mb-[56px]">
                <i class="fas fa-chevron-down mr-2"></i> Día Siguiente
            </button>
        </div>

        <!-- VISTA 2: CALENDARIO -->
        <div id="view-calendar" class="hidden flex-1 flex flex-col h-full w-full absolute inset-0 transition-opacity duration-300">
            <header class="pt-10 pb-2 px-4 flex justify-between items-center z-10 sticky top-0 bg-transparent border-b-2 border-dashed border-[#2e5932]">
                <button onclick="changeMonth(-1)" class="w-8 h-8 flex items-center justify-center text-[#333] border-2 border-[#333] rounded bg-transparent"><i class="fas fa-chevron-left"></i></button>
                <h1 id="grid-month-title" class="text-2xl font-bold text-[#2e5932] capitalize tracking-wide"></h1>
                <button onclick="changeMonth(1)" class="w-8 h-8 flex items-center justify-center text-[#333] border-2 border-[#333] rounded bg-transparent"><i class="fas fa-chevron-right"></i></button>
            </header>
            <main class="flex-1 flex flex-col overflow-hidden p-2 pb-20">
                <div class="grid grid-cols-7 gap-1 mb-1 text-center font-bold text-[#2e5932] text-sm shrink-0 border-b border-dashed border-[#a0aec0] pb-1">
                    <div>L</div><div>M</div><div>M</div><div>J</div><div>V</div><div>S</div><div>D</div>
                </div>
                <div id="calendar-grid" class="grid grid-cols-7 gap-0 flex-1 min-h-0 auto-rows-fr border-t border-l border-gray-300/40"></div>
            </main>
        </div>

        <!-- VISTA 3: DIARIO / AGREGAR EVENTO -->
        <div id="view-form" class="hidden flex-1 flex flex-col h-full w-full absolute inset-0 z-30 transition-transform transform translate-x-full duration-300 notebook-bg">
            <header class="pt-8 pb-2 px-4 flex justify-between items-center sticky top-0 bg-transparent border-b-2 border-dashed border-[#2e5932]">
                <button onclick="switchView(lastView)" class="px-3 py-1 flex items-center gap-2 text-[#333] border-2 border-[#333] rounded font-bold hover:bg-black/5"><i class="fas fa-arrow-left"></i> Volver</button>
                <button onclick="saveEvent()" class="px-4 py-1 text-[#2e5932] font-bold border-2 border-[#2e5932] rounded hover:bg-[#e2f0e3]"><i class="fas fa-save"></i> Guardar</button>
            </header>
            <main class="flex-1 overflow-y-auto no-scrollbar p-4 flex flex-col">
                <div class="mb-2">
                    <input type="text" id="event-title" placeholder="Título del evento..." class="w-full bg-transparent text-2xl font-bold text-[#2e5932] placeholder-gray-400 border-b border-gray-400 border-dashed pb-1">
                </div>
                <div class="flex gap-4 mb-2 mt-2">
                    <input type="date" id="event-date" class="bg-transparent border-b border-gray-400 border-dashed text-gray-700 font-bold focus:outline-none flex-1">
                    <input type="time" id="event-time" class="bg-transparent border-b border-gray-400 border-dashed text-gray-700 font-bold focus:outline-none flex-1">
                </div>
                <!-- Selección de Borde -->
                <div class="flex flex-col gap-2 mb-2 mt-2 border-b border-gray-400 border-dashed pb-2">
                    <div class="flex items-center gap-2">
                        <label class="text-sm font-bold text-gray-700">Estilo:</label>
                        <select id="event-border-type" onchange="toggleColorInputs('event')" class="bg-transparent border border-gray-400 rounded text-sm text-gray-700 font-bold px-1 py-1">
                            <option value="normal">Normal (Gris)</option>
                            <option value="important">Importante (Amarillo)</option>
                            <option value="urgent">Urgente (Rojo)</option>
                            <option value="custom">Personalizado (1 Color)</option>
                            <option value="combined">Combinado (2 Colores)</option>
                        </select>
                    </div>
                    <div id="event-color-inputs" class="hidden flex gap-2 items-center">
                        <input type="color" id="event-color-1" value="#3b82f6" class="w-8 h-8 rounded cursor-pointer border-none bg-transparent">
                        <input type="color" id="event-color-2" value="#ec4899" class="w-8 h-8 rounded cursor-pointer border-none bg-transparent hidden">
                    </div>
                </div>
                <div class="flex-1 mt-2 relative">
                    <textarea id="event-desc" class="diary-input w-full h-full text-lg text-gray-800 placeholder-gray-400" placeholder="Escribe los detalles aquí... Puedes usar *cursiva*, **negrita**, o - viñetas."></textarea>
                </div>
            </main>
        </div>

        <!-- VISTA 4: NOTAS -->
        <div id="view-notes" class="hidden flex-1 flex flex-col h-full w-full absolute inset-0 transition-opacity duration-300">
            <header class="pt-10 pb-4 px-4 flex justify-between items-center z-10 sticky top-0 bg-transparent border-b-2 border-dashed border-[#2e5932]">
                <h1 class="text-2xl font-bold text-[#2e5932] tracking-wide">Mis Notas</h1>
            </header>
            <main id="notes-container" class="flex-1 overflow-y-auto no-scrollbar p-4 pb-24 space-y-4 flex flex-wrap content-start gap-4"></main>
        </div>

        <!-- VISTA 5: AGREGAR NOTA -->
        <div id="view-note-form" class="hidden flex-1 flex flex-col h-full w-full absolute inset-0 z-30 transition-transform transform translate-x-full duration-300 notebook-bg">
            <header class="pt-8 pb-2 px-4 flex justify-between items-center sticky top-0 bg-transparent border-b-2 border-dashed border-[#2e5932]">
                <button onclick="switchView('notes')" class="px-3 py-1 flex items-center gap-2 text-[#333] border-2 border-[#333] rounded font-bold hover:bg-black/5"><i class="fas fa-arrow-left"></i> Volver</button>
                <button onclick="saveNote()" class="px-4 py-1 text-[#2e5932] font-bold border-2 border-[#2e5932] rounded hover:bg-[#e2f0e3]"><i class="fas fa-save"></i> Guardar</button>
            </header>
            <main class="flex-1 overflow-y-auto no-scrollbar p-4 flex flex-col">
                 <!-- Selección de Borde para Nota -->
                 <div class="flex flex-col gap-2 mb-2 mt-2 border-b border-gray-400 border-dashed pb-2">
                    <div class="flex items-center gap-2">
                        <label class="text-sm font-bold text-gray-700">Estilo de Borde:</label>
                        <select id="note-border-type" onchange="toggleColorInputs('note')" class="bg-transparent border border-gray-400 rounded text-sm text-gray-700 font-bold px-1 py-1">
                            <option value="normal">Normal</option>
                            <option value="important">Importante (Amarillo)</option>
                            <option value="urgent">Urgente (Rojo)</option>
                            <option value="custom">Personalizado (1 Color)</option>
                            <option value="combined">Combinado (2 Colores)</option>
                        </select>
                    </div>
                    <div id="note-color-inputs" class="hidden flex gap-2 items-center">
                        <input type="color" id="note-color-1" value="#3b82f6" class="w-8 h-8 rounded cursor-pointer border-none bg-transparent">
                        <input type="color" id="note-color-2" value="#ec4899" class="w-8 h-8 rounded cursor-pointer border-none bg-transparent hidden">
                    </div>
                </div>
                <div class="flex-1 mt-2 relative">
                    <textarea id="note-content" class="diary-input w-full h-full text-lg text-gray-800 placeholder-gray-400" placeholder="Escribe una nota libre aquí... Soporta Markdown."></textarea>
                </div>
            </main>
        </div>

        <!-- MODAL DETALLE EVENTO -->
        <div id="event-detail-modal" class="hidden absolute inset-0 bg-black/50 z-[40] flex items-center justify-center p-4">
            <div class="w-full max-w-sm bg-[#fff9e6] p-6 relative notebook-bg shadow-2xl border-2 border-[#555] rounded-xl">
                <button onclick="editCurrentEvent()" class="absolute top-2 right-12 text-[#2e5932] border-2 border-[#333] rounded w-8 h-8 flex items-center justify-center hover:bg-[#e2f0e3]"><i class="fas fa-edit"></i></button>
                <button onclick="closeEventDetail()" class="absolute top-2 right-2 text-gray-600 border-2 border-[#333] rounded w-8 h-8 flex items-center justify-center hover:bg-black/5"><i class="fas fa-times"></i></button>
                <h2 id="detail-title" class="text-2xl font-bold text-[#2e5932] mb-2 pr-20"></h2>
                <div class="text-sm text-gray-600 mb-4 border-b-2 border-dashed border-[#2e5932] pb-2 flex gap-4">
                    <span><i class="far fa-calendar-alt"></i> <span id="detail-date"></span></span>
                    <span><i class="far fa-clock"></i> <span id="detail-time"></span></span>
                </div>
                <div id="detail-desc" class="markdown-content text-gray-800 max-h-[40vh] overflow-y-auto no-scrollbar"></div>
            </div>
        </div>

        <div id="loading-state" class="absolute inset-0 flex flex-col items-center justify-center text-gray-500 z-50 bg-[#fff9e6]/80 backdrop-blur-sm">
            <i class="fas fa-pencil-alt fa-spin text-4xl mb-3 text-[#2e5932]"></i><p class="font-bold text-xl">Trazando...</p>
        </div>

        <button id="fab-add" onclick="handleFabClick()" class="absolute bottom-[80px] right-6 w-14 h-14 bg-[#facc15] border-[3px] border-[#333] rounded-full text-[#333] shadow-lg flex items-center justify-center text-xl z-20 hover:scale-105 transition-transform"><i class="fas fa-pen"></i></button>

        <!-- Navegación Inferior -->
        <nav class="bg-transparent border-t-[3px] border-dashed border-[#2e5932] p-[10px] flex justify-between gap-[6px] items-center z-10 absolute bottom-0 w-full box-border">
            <button onclick="switchView('list')" id="nav-list" class="flex-1 py-[6px] text-xs sm:text-sm font-bold text-gray-600 bg-white border-[2px] border-gray-300 rounded-lg truncate px-1"><i class="fas fa-list-ul hidden mb-1"></i> Lista</button>
            <button onclick="switchView('week')" id="nav-week" class="flex-1 py-[6px] text-xs sm:text-sm font-bold text-gray-600 bg-white border-[2px] border-gray-300 rounded-lg truncate px-1"><i class="fas fa-calendar-week hidden mb-1"></i> Semana</button>
            <button onclick="switchView('calendar')" id="nav-calendar" class="flex-1 py-[6px] text-xs sm:text-sm font-bold text-gray-600 bg-white border-[2px] border-gray-300 rounded-lg truncate px-1"><i class="far fa-calendar-alt hidden mb-1"></i> Mes</button>
            <button onclick="switchView('notes')" id="nav-notes" class="flex-1 py-[6px] text-xs sm:text-sm font-bold text-gray-600 bg-white border-[2px] border-gray-300 rounded-lg truncate px-1"><i class="fas fa-sticky-note hidden mb-1"></i> Notas</button>
        </nav>

        <div id="toast" class="absolute top-12 left-4 right-4 bg-[#2e5932] text-white px-4 py-2 rounded shadow-lg transition-all duration-300 opacity-0 -translate-y-full pointer-events-none z-[60] flex items-center space-x-2 text-sm text-center justify-center"><span id="toast-message"></span></div>
    </div>

    <!-- PWA & Local Storage Logic -->
    <script>
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW Error:', err));
          });
        }

        let allEvents = [];
        let allNotes = [];
        let displayedMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
        let centralWeekDate = new Date();
        centralWeekDate.setHours(12, 0, 0, 0); 
        let editingEventId = null;
        let currentViewedEventId = null;

        window.lastView = 'list';
        window.currentView = 'list';

        const listContainer = document.getElementById('list-container');
        const calendarGrid = document.getElementById('calendar-grid');
        const weekContainer = document.getElementById('week-container');
        const notesContainer = document.getElementById('notes-container');

        const STORAGE_EVENTS = 'agenda_eventos_v1';
        const STORAGE_NOTES = 'agenda_notas_v1';

        function initApp() {
            marked.setOptions({ breaks: true, gfm: true });
            loadFromLocalStorage();
        }

        function loadFromLocalStorage() {
            const storedEvents = localStorage.getItem(STORAGE_EVENTS);
            const storedNotes = localStorage.getItem(STORAGE_NOTES);
            
            if (storedEvents) allEvents = JSON.parse(storedEvents);
            if (storedNotes) allNotes = JSON.parse(storedNotes);
            
            document.getElementById('loading-state').style.display = 'none';
            updateViews();
            renderNotes();
            switchView('list'); // Iniciar en pestaña lista
        }

        function saveToLocalStorage() {
            localStorage.setItem(STORAGE_EVENTS, JSON.stringify(allEvents));
            localStorage.setItem(STORAGE_NOTES, JSON.stringify(allNotes));
        }

        window.toggleColorInputs = function(prefix) {
            const type = document.getElementById(`${prefix}-border-type`).value;
            const container = document.getElementById(`${prefix}-color-inputs`);
            const c2 = document.getElementById(`${prefix}-color-2`);
            
            if(type === 'custom') {
                container.classList.remove('hidden');
                c2.classList.add('hidden');
            } else if (type === 'combined') {
                container.classList.remove('hidden');
                c2.classList.remove('hidden');
            } else {
                container.classList.add('hidden');
            }
        }

        function getBorderStyle(item) {
            const type = item.borderType || 'normal';
            if (type === 'important') return 'border-color: #facc15; border-width: 2px;';
            if (type === 'urgent') return 'border-color: #ef4444; border-width: 2px;';
            if (type === 'custom') return `border-color: ${item.borderColor1 || '#4a5568'}; border-width: 2px;`;
            if (type === 'combined') {
                const c1 = item.borderColor1 || '#3b82f6';
                const c2 = item.borderColor2 || '#ec4899';
                return `border-width: 2px; border-style: solid; border-image: linear-gradient(45deg, ${c1}, ${c2}) 1;`;
            }
            return 'border-color: #555; border-width: 2px;'; 
        }

        window.saveEvent = function() {
            const title = document.getElementById('event-title').value.trim();
            const date = document.getElementById('event-date').value;
            const time = document.getElementById('event-time').value;
            const description = document.getElementById('event-desc').value.trim();
            
            const borderType = document.getElementById('event-border-type').value;
            const borderColor1 = document.getElementById('event-color-1').value;
            const borderColor2 = document.getElementById('event-color-2').value;

            if (!title || !date) return showToast("¡Necesitas un título y fecha!");

            const eventData = { title, date, time: time || "12:00", description, borderType, borderColor1, borderColor2 };

            if (editingEventId) {
                const idx = allEvents.findIndex(e => e.id === editingEventId);
                if(idx > -1) allEvents[idx] = { ...allEvents[idx], ...eventData };
                showToast("¡Cambios guardados!");
                editingEventId = null;
            } else {
                eventData.completed = false;
                eventData.createdAt = new Date().toISOString();
                eventData.id = Date.now().toString() + Math.random().toString(36).substr(2, 5);
                allEvents.push(eventData);
                showToast("¡Anotado en la libreta!");
            }
            saveToLocalStorage();
            switchView(lastView); 
            updateViews();
        }

        window.saveNote = function() {
            const content = document.getElementById('note-content').value.trim();
            const borderType = document.getElementById('note-border-type').value;
            const borderColor1 = document.getElementById('note-color-1').value;
            const borderColor2 = document.getElementById('note-color-2').value;

            if (!content) return showToast("La nota está vacía");

            const noteData = { 
                id: Date.now().toString() + Math.random().toString(36).substr(2, 5),
                content, 
                createdAt: new Date().toISOString(), 
                borderType, 
                borderColor1, 
                borderColor2 
            };
            
            allNotes.push(noteData); 
            saveToLocalStorage();
            renderNotes();
            showToast("Nota guardada"); 
            switchView('notes');
        }

        window.deleteEvent = function(id, e) { 
            if(e) e.stopPropagation();
            allEvents = allEvents.filter(ev => ev.id !== id); 
            saveToLocalStorage();
            updateViews(); 
            showToast("Borrado");
        }

        window.deleteNote = function(id) {
            allNotes = allNotes.filter(n => n.id !== id); 
            saveToLocalStorage();
            renderNotes(); 
            showToast("Borrada");
        }

        window.toggleEventStatus = function(id, val, e) { 
            if(e) e.stopPropagation();
            const ev = allEvents.find(ev => ev.id === id); 
            if(ev) {
                ev.completed = val; 
                saveToLocalStorage();
                updateViews(); 
            }
        }

        window.handleFabClick = function() {
            if (currentView === 'notes') {
                document.getElementById('note-content').value = ''; 
                document.getElementById('note-border-type').value = 'normal';
                toggleColorInputs('note');
                switchView('note-form');
            } else { openForm(); }
        }

        window.switchView = function(viewName) {
            if (viewName !== 'form' && viewName !== 'note-form') lastView = viewName;
            currentView = viewName;
            const views = ['list', 'week', 'calendar', 'notes', 'form', 'note-form'];
            
            // Lógica botones de navegación inferior
            ['nav-list', 'nav-week', 'nav-calendar', 'nav-notes'].forEach(id => {
                const el = document.getElementById(id); 
                if (el) { 
                    el.classList.replace('bg-[#e2f0e3]', 'bg-white'); 
                    el.classList.remove('border-[#2e5932]'); 
                    el.classList.add('border-gray-300');
                    el.classList.replace('text-[#2e5932]', 'text-gray-600'); 
                }
            });
            if (['list', 'week', 'calendar', 'notes'].includes(viewName)) {
                const activeNav = document.getElementById('nav-' + viewName);
                if (activeNav) { 
                    activeNav.classList.replace('bg-white', 'bg-[#e2f0e3]'); 
                    activeNav.classList.remove('border-gray-300'); 
                    activeNav.classList.add('border-[#2e5932]'); 
                    activeNav.classList.replace('text-gray-600', 'text-[#2e5932]'); 
                }
            }

            views.forEach(v => {
                const el = document.getElementById('view-' + v);
                if (v === 'form' || v === 'note-form') {
                    if(v === viewName) { el.classList.remove('hidden'); setTimeout(() => el.classList.remove('translate-x-full'), 10); }
                    else { el.classList.add('translate-x-full'); setTimeout(() => el.classList.add('hidden'), 300); }
                } else {
                    if (v === viewName) el.classList.remove('hidden'); else el.classList.add('hidden');
                }
            });
        }

        window.openForm = function(dateStr = null) {
            editingEventId = null;
            document.getElementById('event-title').value = ''; document.getElementById('event-desc').value = '';
            document.getElementById('event-border-type').value = 'normal'; toggleColorInputs('event');
            if (dateStr && typeof dateStr === 'string') document.getElementById('event-date').value = dateStr;
            else document.getElementById('event-date').valueAsDate = new Date();
            const now = new Date(); now.setHours(now.getHours() + 1); now.setMinutes(0);
            document.getElementById('event-time').value = now.toTimeString().substring(0, 5);
            switchView('form');
        }

        window.openEventDetail = function(id) {
            currentViewedEventId = id; const ev = allEvents.find(e => e.id === id); if(!ev) return;
            document.getElementById('detail-title').textContent = ev.title;
            const dateObj = new Date(`${ev.date}T${ev.time}`);
            document.getElementById('detail-date').textContent = dateObj.toLocaleDateString('es-ES', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            document.getElementById('detail-time').textContent = dateObj.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
            document.getElementById('detail-desc').innerHTML = ev.description ? marked.parse(ev.description) : '<p class="text-gray-400 italic">Sin detalles</p>';
            document.getElementById('event-detail-modal').classList.remove('hidden');
        }

        window.editCurrentEvent = function() {
            const ev = allEvents.find(e => e.id === currentViewedEventId); if(!ev) return;
            closeEventDetail(); editingEventId = currentViewedEventId;
            document.getElementById('event-title').value = ev.title;
            document.getElementById('event-date').value = ev.date;
            document.getElementById('event-time').value = ev.time || "12:00";
            document.getElementById('event-desc').value = ev.description || "";
            document.getElementById('event-border-type').value = ev.borderType || "normal";
            if(ev.borderColor1) document.getElementById('event-color-1').value = ev.borderColor1;
            if(ev.borderColor2) document.getElementById('event-color-2').value = ev.borderColor2;
            toggleColorInputs('event');
            switchView('form');
        }

        window.closeEventDetail = function() { document.getElementById('event-detail-modal').classList.add('hidden'); currentViewedEventId = null; }
        window.changeMonth = function(offset) { displayedMonth.setMonth(displayedMonth.getMonth() + offset); updateViews(); }
        window.changeWeekDay = function(offset) { centralWeekDate.setDate(centralWeekDate.getDate() + offset); updateViews(); }
        window.onWeekDateSelected = function(e) {
            if (e.target.value) { const [y, m, d] = e.target.value.split('-'); centralWeekDate = new Date(y, m - 1, d, 12, 0, 0); updateViews(); }
        }

        function updateViews() {
            document.getElementById('loading-state').style.display = 'none';
            const year = displayedMonth.getFullYear(); const month = displayedMonth.getMonth();
            const monthName = displayedMonth.toLocaleDateString('es-ES', { month: 'long', year: 'numeric' });
            document.getElementById('list-month-title').textContent = monthName; document.getElementById('grid-month-title').textContent = monthName;
            const monthEvents = allEvents.filter(ev => { const evDate = new Date(ev.date + 'T12:00:00'); return evDate.getFullYear() === year && evDate.getMonth() === month; });
            renderList(monthEvents); renderCalendar(year, month, monthEvents); renderWeek();
        }

        function renderList(events) {
            listContainer.innerHTML = '';
            if (events.length === 0) return listContainer.innerHTML = `<div class="flex flex-col items-center pt-24 text-gray-400 opacity-80"><i class="fas fa-seedling text-5xl mb-4"></i><p class="italic font-sans text-sm">Mes libre</p></div>`;
            events.sort((a, b) => new Date(`${a.date}T${a.time}`) - new Date(`${b.date}T${b.time}`));
            
            events.forEach(ev => {
                const dateObj = new Date(`${ev.date}T${ev.time}`);
                const isCompleted = ev.completed ? 'checked' : ''; const textClass = ev.completed ? 'line-through opacity-50' : '';
                const styleStr = getBorderStyle(ev);
                
                listContainer.insertAdjacentHTML('beforeend', `
                    <div style="${styleStr}" class="bg-transparent rounded-xl p-[10px] mb-[15px] flex gap-2 items-center relative cursor-pointer hover:bg-black/5" onclick="openEventDetail('${ev.id}')">
                        <div class="pl-1" onclick="event.stopPropagation()"><input type="checkbox" class="sketch-checkbox" ${isCompleted} onchange="toggleEventStatus('${ev.id}', this.checked, event)"></div>
                        <div class="flex flex-col items-center justify-center min-w-[40px] ${textClass}">
                            <span class="text-[10px] font-bold text-[#2e5932] uppercase leading-none mb-[2px]">${dateObj.toLocaleDateString('es-ES', { weekday: 'short' }).replace('.','')}</span>
                            <span class="text-2xl font-bold text-gray-900 leading-none">${dateObj.getDate()}</span>
                        </div>
                        <div class="flex-1 min-w-0 border-l border-dashed border-[#a0aec0] pl-3 py-1 ${textClass}">
                            <h3 class="text-lg font-bold text-gray-900 truncate leading-tight">${ev.title}</h3>
                            <div class="text-[11px] text-gray-600 font-sans mt-1"><i class="far fa-clock"></i> ${ev.time}</div>
                        </div>
                        <button onclick="deleteEvent('${ev.id}', event)" class="w-8 h-8 rounded text-red-400/80 hover:text-red-500 flex items-center justify-center z-10"><i class="fas fa-trash-alt"></i></button>
                    </div>`);
            });
        }

        function renderWeek() {
            weekContainer.innerHTML = '';
            document.getElementById('week-date-picker').value = centralWeekDate.toISOString().split('T')[0];
            document.getElementById('week-central-date-display').textContent = centralWeekDate.toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric' });
            const todayStr = new Date().toDateString();

            for (let i = -4; i <= 4; i++) {
                const targetDate = new Date(centralWeekDate); targetDate.setDate(centralWeekDate.getDate() + i);
                const dStr = `${targetDate.getFullYear()}-${String(targetDate.getMonth() + 1).padStart(2, '0')}-${String(targetDate.getDate()).padStart(2, '0')}`;
                const dayEvents = allEvents.filter(ev => ev.date === dStr).sort((a, b) => new Date(`${a.date}T${a.time}`) - new Date(`${b.date}T${b.time}`));
                
                let evHtml = dayEvents.length ? dayEvents.map(ev => {
                    const styleStr = getBorderStyle(ev);
                    return `
                    <div style="${styleStr}" class="flex items-center justify-between p-2 rounded cursor-pointer bg-transparent mb-[6px]" onclick="openEventDetail('${ev.id}'); event.stopPropagation();">
                        <div class="flex items-center gap-2 overflow-hidden flex-1">
                            <input type="checkbox" class="sketch-checkbox w-4 h-4 min-w-[16px] outline-none" ${ev.completed ? 'checked' : ''} onclick="toggleEventStatus('${ev.id}', this.checked, event)">
                            <span class="font-bold text-[15px] text-gray-900 truncate ${ev.completed ? 'line-through opacity-50' : ''}">${ev.title}</span>
                        </div>
                        <span class="text-[11px] text-gray-600 font-sans whitespace-nowrap"><i class="far fa-clock"></i> ${ev.time}</span>
                    </div>`
                }).join('') : '<p class="text-sm text-gray-400/80 italic text-center py-1 font-sans">Sin anotaciones</p>';

                const isCentral = i === 0;
                weekContainer.insertAdjacentHTML('beforeend', `
                    <div class="rounded-xl p-3 mb-[15px] flex flex-col gap-1 relative ${isCentral ? 'border-[#2e5932] border-[2px] bg-[#e2f0e3] shadow-sm' : 'border-[#555] border-[2px] bg-transparent'}" ${!isCentral ? `onclick="centralWeekDate = new Date(${targetDate.getFullYear()}, ${targetDate.getMonth()}, ${targetDate.getDate()}, 12, 0, 0); updateViews();"` : ''}>
                        <div class="flex justify-between items-baseline border-b border-dashed border-[#a0aec0] pb-1 mb-2">
                            <h3 class="font-bold ${isCentral ? 'text-[#2e5932] text-lg' : 'text-gray-800 text-lg'}">${targetDate.toLocaleDateString('es-ES', { weekday: 'long' })} <span class="text-sm ml-1 text-gray-500 font-normal">${targetDate.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' })}</span></h3>
                            ${targetDate.toDateString() === todayStr ? '<span class="text-[10px] bg-[#a3d9a5] text-[#2e5932] px-[8px] py-[2px] rounded-full font-bold font-sans tracking-wide">Hoy</span>' : ''}
                        </div>
                        <div class="flex flex-col">${evHtml}</div>
                    </div>`);
            }
        }

        function renderNotes() {
            notesContainer.innerHTML = '';
            if (allNotes.length === 0) return notesContainer.innerHTML = `<div class="w-full flex flex-col items-center pt-24 text-gray-400 opacity-80"><i class="fas fa-leaf text-5xl mb-4"></i><p class="italic font-sans text-sm">Aún no hay notas.</p></div>`;
            const sortedNotes = [...allNotes].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
            sortedNotes.forEach(note => {
                const styleStr = getBorderStyle(note);
                notesContainer.insertAdjacentHTML('beforeend', `
                    <div style="${styleStr}" class="rounded-xl p-4 w-full mb-[15px] relative bg-transparent">
                        <div class="markdown-content text-gray-800 text-base font-sans mb-6 overflow-hidden">${marked.parse(note.content)}</div>
                        <div class="absolute bottom-2 left-3 text-[11px] text-gray-500 font-sans">${new Date(note.createdAt).toLocaleDateString('es-ES')}</div>
                        <button onclick="deleteNote('${note.id}')" class="absolute bottom-2 right-2 text-red-400/80 hover:text-red-500 rounded w-6 h-6 flex items-center justify-center border-none"><i class="fas fa-trash-alt"></i></button>
                    </div>`);
            });
        }

        function renderCalendar(year, month, events) {
            calendarGrid.innerHTML = '';
            const startDay = (new Date(year, month, 1).getDay() + 6) % 7; 
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            for (let i = 0; i < startDay; i++) calendarGrid.innerHTML += `<div class="calendar-day bg-transparent"></div>`;
            for (let day = 1; day <= daysInMonth; day++) {
                const dayEvents = events.filter(e => new Date(e.date + 'T12:00:00').getDate() === day);
                const evHtml = dayEvents.map(e => `<div onclick="openEventDetail('${e.id}'); event.stopPropagation();" class="calendar-event ${e.completed ? 'bg-gray-300 text-gray-600 line-through' : ''}">${e.title}</div>`).join('');
                const isToday = new Date().toDateString() === new Date(year, month, day).toDateString();
                calendarGrid.innerHTML += `
                    <div onclick="openForm('${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}')" class="calendar-day p-1 cursor-pointer hover:bg-black/5 flex flex-col ${isToday ? 'border-2 border-[#2e5932] bg-[#e2f0e3]/60' : 'bg-transparent'}">
                        <span class="text-sm font-bold block text-right mb-1 ${isToday ? 'text-[#2e5932]' : 'text-gray-800'}">${day}</span>
                        <div class="flex-1 overflow-hidden flex flex-col gap-[1px]">${evHtml}</div>
                    </div>`;
            }
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toast-message').textContent = msg;
            t.classList.remove('opacity-0', '-translate-y-full', 'pointer-events-none'); t.classList.add('translate-y-0');
            setTimeout(() => { t.classList.add('opacity-0', '-translate-y-full', 'pointer-events-none'); t.classList.remove('translate-y-0'); }, 2500);
        }

        initApp();
    </script>
</body>
</html>
